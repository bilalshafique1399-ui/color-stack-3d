name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew missing problem
        run: |
          ls -la
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew nahi mila, bana raha hun"
            sudo apt-get update -qq
            sudo apt-get install -y -qq gradle
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Color-Stack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
